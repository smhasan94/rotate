[package]
name = "rotate"
version = "0.0.1"
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
description = "Revoke and rotate leaked secrets safely, end to end"
repository = "https://github.com/smhasan94/rotate"
publish = false

[dependencies]
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
# Test harness (SHA-216). reqwest has default features off so no TLS crates
# arrive until SHA-273 settles the license allowlist.
reqwest = { version = "0.12", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
