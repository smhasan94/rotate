[package]
name = "rotate"
version = "0.0.1"
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
description = "Revoke and rotate leaked secrets safely, end to end"
repository = "https://github.com/smhasan94/rotate"
publish = false

[features]
# Registers mock providers under the real names so CLI tests can run end
# to end before the real providers exist. Never enabled for releases.
test-providers = []
# Adds the hidden `__test-console` subcommand that prints, fails or panics
# with a secret read from stdin, so CLI tests can prove the console, error
# and panic paths are redacted (SHA-246). Never enabled for releases.
test-commands = []

[dependencies]
async-trait = "0.1"
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio", "sso", "credentials-process"] }
aws-sdk-secretsmanager = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
clap = { version = "4", features = ["derive", "env"] }
# Provider token patterns for log redaction (SHA-218).
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_norway = "0.9"
serde_path_to_error = "0.1"
sha2 = "0.11"
subtle = "2"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }
zeroize = { version = "1", features = ["alloc", "derive"] }

[dev-dependencies]
assert_cmd = "2"
# Independent encoders for the redaction tests (SHA-218).
base64 = "0.22"
# Validates `plan --json` against docs/plan-schema.json (SHA-250). Default
# features off: no HTTP resolver.
jsonschema = { version = "0.58", default-features = false }
predicates = "3"
# Test harness (SHA-216). reqwest has default features off so no TLS crates
# arrive until SHA-273 settles the license allowlist.
reqwest = { version = "0.12", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
urlencoding = "2"
wiremock = "0.6"
