[package]
name = "rotate"
version = "0.0.1"
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
description = "Revoke and rotate leaked secrets safely, end to end"
repository = "https://github.com/smhasan94/rotate"
publish = false

[dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_norway = "0.9"
serde_path_to_error = "0.1"
sha2 = "0.11"
subtle = "2"
thiserror = "2"
tracing = "0.1"
zeroize = { version = "1", features = ["alloc", "derive"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
# Test harness (SHA-216). reqwest has default features off so no TLS crates
# arrive until SHA-273 settles the license allowlist.
reqwest = { version = "0.12", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
wiremock = "0.6"
