# Self-test fixture for CI (SHA-212 T4): deny.toml with MIT removed from the
# allowlist. `cargo deny --config ci/deny-selftest.toml check licenses` must
# fail. Keep in sync with deny.toml apart from that one line.

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
