# rotate as a composite GitHub Action: fetch secret-scanning alerts with
# the REST API and pipe them into `rotate plan` (SHA-198), which changes
# nothing, or, with `mode: apply` in a job behind an environment approval,
# into `rotate apply --confirm ... --wait` (SHA-338). Usage, the token, the
# trigger patterns and the approval workflow are in docs/github-action.md.
#
# Inputs reach the scripts through `env:` only, never interpolated into
# `run:` text, so a hostile dispatch payload cannot inject shell.
name: rotate leaked secrets
description: Plan the rotation of GitHub secret-scanning alerts with rotate, and apply it behind an environment approval.
author: smhasan94
branding:
  icon: refresh-cw
  color: red

inputs:
  alert-number:
    description: "Alert number(s), comma-separated, such as 42 or 42,43. Empty: plan the open alerts of the six supported secret types (first 100)."
    required: false
    default: ""
  repository:
    description: "owner/repo the alerts belong to."
    required: false
    default: ${{ github.repository }}
  alerts-token:
    description: "Token with Secret scanning alerts: read on the repository (a GitHub App installation token or a fine-grained PAT). The workflow's GITHUB_TOKEN cannot read alerts."
    required: true
  api-url:
    description: "GitHub REST API base URL. https, or http to a loopback address."
    required: false
    default: ${{ github.api_url }}
  version:
    description: "rotate release to download and run. Ignored when rotate-binary is set."
    required: false
    default: "0.3.0"
  rotate-binary:
    description: "Path to a rotate binary to run instead of downloading a release."
    required: false
    default: ""
  config:
    description: "Path to rotate.yaml. A missing file is an error unless it is the default."
    required: false
    default: rotate.yaml
  mode:
    description: "plan (the default) makes no change. apply rotates the confirmed rotations; run it only in a job behind an environment with required reviewers."
    required: false
    default: plan
  verbose:
    description: "rotate log verbosity, 0 to 3 (the number of -v flags). Logs are redacted."
    required: false
    default: "0"
  overlap:
    description: "Overlap window between updating the consumers and revoking the old secret, such as 30m (rotate --overlap). Empty: rotate.yaml's overlap_window."
    required: false
    default: ""
  confirm:
    description: "apply: the rotation ids to apply, comma-separated, from the plan job's rotation-ids output."
    required: false
    default: ""
  state-dir:
    description: "apply: the directory the plan job's state artifact was downloaded to (it holds .rotate/state.json)."
    required: false
    default: ""
  force:
    description: "apply: true revokes even if some consumers could not be updated (rotate --force). Recorded in the audit log."
    required: false
    default: "false"
  replacement-env:
    description: "apply: name of the environment variable holding a replacement you created by hand, for providers in manual replacement mode (rotate --replacement-from-env). One rotation per run. Refused: the credential variables rotate and this Action read (ROTATE_GITHUB_TOKEN, GITHUB_TOKEN, ROTATE_NPM_TOKEN, NPM_TOKEN, ROTATE_NPM_OTP, OPENAI_ADMIN_KEY, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN, AWS_CONTAINER_AUTHORIZATION_TOKEN, ALERTS_TOKEN) and names starting with ACTIONS_ or RUNNER_."
    required: false
    default: ""
  max-wait:
    description: "apply: the longest overlap window the step waits out. Keep it below the job's timeout-minutes; GitHub-hosted jobs stop at 6 hours. A longer window: no revoke, exit 3 with the revoke time."
    required: false
    default: "5h"
  upload-audit:
    description: "apply: auto, true or false. Upload the state directory's .rotate/ (audit log and state file, fingerprints only) as the artifact rotate-audit-<run id>-<attempt>, kept 30 days. auto uploads only when the repository is private or internal, and skips with a notice when it is public or its visibility cannot be read."
    required: false
    default: auto
  audit-suffix:
    description: "apply: appended to the audit artifact's name as rotate-audit-<run id>-<attempt>-<suffix>, so two apply steps in one run do not collide. 1 to 40 letters, digits, '.', '_' or '-'."
    required: false
    default: ""

outputs:
  rotation-ids:
    description: "plan: comma-separated rotation ids from the plan; empty when there is nothing to rotate."
    value: ${{ steps.rotate.outputs.rotation-ids }}
  plan-path:
    description: "plan: path of plan.json, the `rotate plan --json` output (fingerprints and references only)."
    value: ${{ steps.rotate.outputs.plan-path }}
  summary-path:
    description: "Path of the Markdown written to the job summary."
    value: ${{ steps.rotate.outputs.summary-path }}
  state-dir:
    description: "Directory holding .rotate/state.json and .rotate/audit.jsonl for this run."
    value: ${{ steps.rotate.outputs.state-dir }}
  exit-code:
    description: "rotate's exit code, or the Action's own when rotate did not run."
    value: ${{ steps.rotate.outputs.exit-code }}

runs:
  using: composite
  steps:
    # AC6: inputs are checked before any download or API request.
    - id: inputs
      shell: bash
      env:
        ALERTS_TOKEN: ${{ inputs.alerts-token }}
        ALERT_NUMBER: ${{ inputs.alert-number }}
        REPOSITORY: ${{ inputs.repository }}
        API_URL: ${{ inputs.api-url }}
        ROTATE_CONFIG_PATH: ${{ inputs.config }}
        MODE: ${{ inputs.mode }}
        VERBOSE: ${{ inputs.verbose }}
        OVERLAP: ${{ inputs.overlap }}
        CONFIRM: ${{ inputs.confirm }}
        PLAN_STATE_DIR: ${{ inputs.state-dir }}
        FORCE: ${{ inputs.force }}
        REPLACEMENT_ENV: ${{ inputs.replacement-env }}
        MAX_WAIT: ${{ inputs.max-wait }}
        UPLOAD_AUDIT: ${{ inputs.upload-audit }}
        AUDIT_SUFFIX: ${{ inputs.audit-suffix }}
      run: bash "$GITHUB_ACTION_PATH/action/run.sh" --check-inputs
    - id: install
      shell: bash
      env:
        ROTATE_VERSION: ${{ inputs.version }}
        ROTATE_BINARY: ${{ inputs.rotate-binary }}
      run: bash "$GITHUB_ACTION_PATH/action/install.sh"
    - id: rotate
      shell: bash
      env:
        ROTATE_BIN: ${{ steps.install.outputs.path }}
        ALERTS_TOKEN: ${{ inputs.alerts-token }}
        ALERT_NUMBER: ${{ inputs.alert-number }}
        REPOSITORY: ${{ inputs.repository }}
        API_URL: ${{ inputs.api-url }}
        ROTATE_CONFIG_PATH: ${{ inputs.config }}
        MODE: ${{ inputs.mode }}
        VERBOSE: ${{ inputs.verbose }}
        OVERLAP: ${{ inputs.overlap }}
        CONFIRM: ${{ inputs.confirm }}
        PLAN_STATE_DIR: ${{ inputs.state-dir }}
        FORCE: ${{ inputs.force }}
        REPLACEMENT_ENV: ${{ inputs.replacement-env }}
        MAX_WAIT: ${{ inputs.max-wait }}
        UPLOAD_AUDIT: ${{ inputs.upload-audit }}
        AUDIT_SUFFIX: ${{ inputs.audit-suffix }}
        # SHA-348: upload-audit auto. Absent on some events (schedule);
        # run.sh then asks the API.
        REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        ROTATE_ACTOR: github-actions/${{ github.repository }}/${{ github.run_id }}
      run: bash "$GITHUB_ACTION_PATH/action/run.sh"
    # SHA-338: the audit trail of an apply, kept after the runner is gone,
    # also when apply failed. Fingerprints, ids and references only.
    # SHA-348: run.sh decides upload-audit (auto: not on a public
    # repository) before anything else, and audit-suffix is checked by the
    # inputs step, so a step that never started uploads nothing.
    - id: audit
      if: ${{ always() && inputs.mode == 'apply' && steps.rotate.outputs.upload-audit == 'true' && steps.rotate.outputs.state-dir != '' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: rotate-audit-${{ github.run_id }}-${{ github.run_attempt }}${{ inputs.audit-suffix != '' && format('-{0}', inputs.audit-suffix) || '' }}
        path: ${{ steps.rotate.outputs.state-dir }}/.rotate/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 30
