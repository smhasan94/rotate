# Four checks, each its own job, each on Linux and macOS. Separate jobs so a
# red fmt never hides the clippy, test or deny result (SHA-212 AC2).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: fmt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      # SHA-194 AC1: the build itself must be warning-free.
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-features
      - name: cargo test
        shell: bash
        run: cargo test --all-features 2>&1 | tee test.log
      - name: live tests are ignored by default (SHA-216 T3)
        # ROTATE_LIVE_TESTS is never set in CI, so the live smoke test must
        # show up as ignored, never as run.
        shell: bash
        run: |
          grep -E "^test live_smoke .* ignored" test.log
          ! grep -E "^test live_smoke .* ok" test.log

  deny:
    name: deny (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - name: cargo deny check
        run: cargo deny check
      - name: deny self-test (SHA-212 T4)
        # Proves the license gate can fail: with MIT removed from the
        # allowlist the check must exit non-zero and name a rejected crate.
        shell: bash
        run: |
          set +e
          out=$(cargo deny --config ci/deny-selftest.toml check licenses 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "self-test failed: expected cargo deny to reject a license"
            exit 1
          fi
          if ! grep -q "clap" <<<"$out"; then
            echo "self-test failed: rejection output did not name clap"
            echo "$out"
            exit 1
          fi
          echo "self-test ok: license gate rejects when MIT is disallowed"
