# Four checks, each its own job, each on Linux and macOS. Separate jobs so a
# red fmt never hides the clippy, test or deny result (SHA-212 AC2).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: fmt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      # SHA-194 AC1: the build itself must be warning-free.
      RUSTFLAGS: -D warnings
      # SHA-246 T4: tests/lint.rs runs clippy and must not skip here.
      ROTATE_REQUIRE_CLIPPY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-features
      - name: cargo test
        shell: bash
        run: cargo test --all-features 2>&1 | tee test.log
      - name: smoke-test the binary as released
        # `cargo test` enables every dependency feature that dev-dependencies
        # ask for; a plain build does not. Run the binary built without
        # dev-dependencies or features, as a release ships it.
        shell: bash
        run: |
          cargo build --locked
          ci/smoke.sh target/debug/rotate
      - name: live tests are ignored by default (SHA-216 T3, SHA-268 T1)
        # ROTATE_LIVE_TESTS is never set in CI, so every `live_` test must
        # show up as ignored, never as run.
        shell: bash
        run: |
          defined=$(grep -rhoE --exclude-dir=common "fn live_[a-z0-9_]+" tests | sort -u | wc -l)
          ignored=$(grep -E "^test live_[a-z0-9_]+ \.\.\. ignored" test.log | sort -u | wc -l)
          echo "live tests defined: $defined, reported ignored: $ignored"
          [ "$defined" -gt 0 ] && [ "$defined" -eq "$ignored" ]
          ! grep -E "^test live_[a-z0-9_]+ \.\.\. (ok|FAILED)" test.log

  deny:
    name: deny (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - name: cargo deny check
        run: cargo deny check
      - name: deny self-test (SHA-212 T4)
        # Proves the license gate can fail: with MIT removed from the
        # allowlist the check must exit non-zero and name a rejected crate.
        shell: bash
        run: |
          set +e
          out=$(cargo deny --config ci/deny-selftest.toml check licenses 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "self-test failed: expected cargo deny to reject a license"
            exit 1
          fi
          if ! grep -q "clap" <<<"$out"; then
            echo "self-test failed: rejection output did not name clap"
            echo "$out"
            exit 1
          fi
          echo "self-test ok: license gate rejects when MIT is disallowed"

  docs:
    # Text checks only, so Linux is enough (SHA-213 T1, T2).
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ci/check-docs.sh
