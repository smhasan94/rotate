# cargo-deny configuration. CI runs `cargo deny check` on every PR.
# License additions need a note in CONTRIBUTING; see SHA-273 for the
# pending decision on MPL-2.0 and ring before reqwest is added.

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
